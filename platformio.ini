; RoadPanel no ESP32 (DevKit, sem PSRAM) + TFT ST7796S 480x320 SPI.
; Abra esta pasta no VS Code com a extensão PlatformIO e clique em Upload.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; app grande (3 MB): pista, fontes e placas ficam na flash
board_build.partitions = huge_app.csv
build_unflags = -Os -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
upload_speed = 921600
